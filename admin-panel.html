<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>大会運営｜尾張藩大会</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;

      color: #2b2926;

      background-color: #f3ead5;

      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(80, 60, 40, 0.025) 4px
        );
    }

    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 35px 0 60px;
    }

    /* ヘッダー */

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .small-title {
      font-size: 13px;
      letter-spacing: 0.25em;
      color: #6d6255;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0;

      font-size: clamp(28px, 6vw, 42px);
      font-weight: normal;

      letter-spacing: 0.15em;
      color: #263d52;
    }

    .line {
      width: 100px;
      height: 2px;

      margin: 18px auto;

      background: #a33a32;
    }

    .description {
      margin: 0;

      color: #756b5f;
      font-size: 13px;
      letter-spacing: 0.08em;
    }

    /* 共通カード */

    .panel {
      margin-bottom: 25px;
      padding: 25px;

      background: rgba(255, 252, 241, 0.78);

      border: 1px solid #a99b83;
    }

    .panel-title {
      margin: 0 0 20px;

      padding-bottom: 10px;

      border-bottom: 1px solid #b9ad99;

      font-size: 20px;
      font-weight: normal;

      color: #263d52;
      letter-spacing: 0.12em;
    }

    /* フォーム */

    .form-row {
      margin-bottom: 20px;
    }

    .form-row:last-child {
      margin-bottom: 0;
    }

    label {
      display: block;

      margin-bottom: 8px;

      font-size: 13px;
      color: #5e554c;

      letter-spacing: 0.08em;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;

      padding: 12px;

      border: 1px solid #aaa08f;

      background: #fffdf5;

      font-family: inherit;
      font-size: 15px;

      color: #2b2926;

      outline: none;
    }

    select:focus,
    input:focus {
      border-color: #263d52;
    }

    .number-input {
      max-width: 220px;
    }

    /* 説明 */

    .notice {
      padding: 14px 16px;

      margin-top: 15px;

      background: rgba(38, 61, 82, 0.06);

      border-left: 3px solid #263d52;

      font-size: 13px;

      line-height: 1.8;
      color: #5e554c;
    }

    /* ボタン */

    .button-area {
      text-align: center;

      margin-top: 30px;
    }

    button {
      padding: 14px 45px;

      border: none;

      background: #263d52;
      color: #fffaf0;

      font-family: inherit;
      font-size: 15px;

      letter-spacing: 0.15em;

      cursor: pointer;
    }

    button:hover {
      background: #314e67;
    }

    /* 参加者入力 */

    #participant-area {
      display: none;
    }

    .participant-group {
      margin-bottom: 30px;
    }

    .participant-group:last-child {
      margin-bottom: 0;
    }

    .participant-title {
      margin-bottom: 15px;

      color: #a33a32;

      font-size: 16px;
      letter-spacing: 0.1em;
    }

    .participant-list {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
    }

    .participant-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .participant-number {
      width: 30px;

      text-align: right;

      color: #756b5f;
      font-size: 13px;
    }

    .participant-item input {
      flex: 1;
    }

    /* トップへ */

    .back {
      display: block;

      margin-top: 30px;

      text-align: center;

      color: #756b5f;

      text-decoration: none;

      font-size: 12px;

      letter-spacing: 0.1em;
    }

    .back:hover {
      color: #263d52;
    }

    /* スマホ */

    @media (max-width: 600px) {

      .container {
        padding-top: 25px;
      }

      .panel {
        padding: 20px 16px;
      }

      .participant-list {
        grid-template-columns: 1fr;
      }

      .number-input {
        max-width: none;
      }

      button {
        width: 100%;
      }
    }
    /* 大会表 */

#tournament-area {
  display: none;
}

.bracket-info {
  margin-bottom: 20px;
  padding: 14px 16px;
  background: rgba(38, 61, 82, 0.06);
  border-left: 3px solid #263d52;
  font-size: 13px;
  line-height: 1.8;
}

.bracket-round {
  margin-bottom: 35px;
}

.bracket-round-title {
  margin-bottom: 15px;
  padding-bottom: 8px;
  border-bottom: 1px solid #b9ad99;
  color: #263d52;
  font-size: 18px;
}

.match {
  margin-bottom: 15px;
  padding: 12px;
  background: #fffdf5;
  border: 1px solid #aaa08f;
}

.match-number {
  margin-bottom: 8px;
  color: #756b5f;
  font-size: 12px;
}

.player-row {
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 38px;
  padding: 5px 0;
  border-bottom: 1px solid #e3dac8;
}

.player-row:last-child {
  border-bottom: none;
}

.player-name {
  flex: 1;
}

.host-button {
  width: auto;
  padding: 5px 10px;
  background: transparent;
  color: #263d52;
  border: 1px solid #aaa08f;
  font-size: 12px;
  letter-spacing: 0;
}

.host-button.active {
  background: #263d52;
  color: #fffaf0;
}

.bye {
  color: #9b8f80;
  font-style: italic;
}

.advance-button {
  width: 100%;
  margin-top: 10px;
  padding: 8px;
  background: #a33a32;
  font-size: 12px;
}

@media (max-width: 600px) {
  .match {
    padding: 10px;
  }

  .player-row {
    font-size: 14px;
  }

  .host-button {
    padding: 5px 8px;
  }
}
  </style>
</head>

<body>

  <main class="container">

    <!-- ヘッダー -->

    <header>

      <div class="small-title">
        尾張藩主催
      </div>

      <h1>
        大会運営
      </h1>

      <div class="line"></div>

      <p class="description">
        大会設定・参加者登録
      </p>

    </header>


    <!-- 大会設定 -->

    <section class="panel">

      <h2 class="panel-title">
        大会設定
      </h2>


      <!-- 種目 -->

      <div class="form-row">

        <label for="game">
          大会種目
        </label>

        <select id="game">

          <option value="">
            選択してください
          </option>

          <option value="hanafuda">
            花札
          </option>

          <option value="mahjong">
            麻雀
          </option>

        </select>

      </div>


      <!-- 参加人数 -->

      <div class="form-row">

        <label for="players">
          参加人数
        </label>

        <input
          type="number"
          id="players"
          class="number-input"
          min="2"
          max="256"
          placeholder="例：32"
        >

        <div class="notice">
          参加人数を入力すると、必要なシード数と参加者入力欄を自動で作成します。
        </div>

      </div>


      <!-- シード人数 -->

      <div class="form-row">

        <label for="seeds">
          シード人数
        </label>

        <input
          type="number"
          id="seeds"
          class="number-input"
          min="0"
          max="256"
          value="0"
        >

        <div class="notice">
          シード人数は運営側で自由に設定できます。
        </div>

      </div>


      <!-- 参加者入力生成 -->

      <div class="button-area">

        <button onclick="createParticipants()">
          参加者入力欄を作成
        </button>

      </div>

    </section>


    <!-- 参加者 -->

    <section
      class="panel"
      id="participant-area"
    >

      <h2 class="panel-title">
        参加者登録
      </h2>


      <!-- シード -->

      <div
        class="participant-group"
        id="seed-group"
      >

        <div class="participant-title">
          ◆ シード参加者
        </div>

        <div
          class="participant-list"
          id="seed-list"
        ></div>

      </div>


      <!-- 一般参加者 -->

      <div
        class="participant-group"
        id="normal-group"
      >

        <div class="participant-title">
          ◆ シード以外の参加者
        </div>

        <div
          class="participant-list"
          id="normal-list"
        ></div>

      </div>


      <!-- 大会表作成 -->

      <div class="button-area">

        <button onclick="createTournament()">
          大会表を作成
        </button>

      </div>

    </section>
<section class="panel" id="tournament-area">
  <h2 class="panel-title">
    花札大会表
  </h2>

  <div class="bracket-info" id="bracket-info"></div>

  <div id="bracket"></div>
</section>

    <a
      href="index.html"
      class="back"
    >
      ← 大会トップへ戻る
    </a>

  </main>


<script>

let tournamentData = null;


/* =========================
   参加者入力欄
========================= */

function createParticipants() {

  const players = Number(
    document.getElementById("players").value
  );

  const seeds = Number(
    document.getElementById("seeds").value
  );


  if (players < 2) {
    alert("参加人数を2人以上で入力してください。");
    return;
  }


  if (seeds < 0 || seeds > players) {
    alert("シード人数を正しく入力してください。");
    return;
  }


  const seedList =
    document.getElementById("seed-list");

  seedList.innerHTML = "";


  for (let i = 1; i <= seeds; i++) {

    const item =
      document.createElement("div");

    item.className =
      "participant-item";

    item.innerHTML = `
      <span class="participant-number">
        ${i}.
      </span>

      <input
        type="text"
        placeholder="シード${i}の名前"
        data-type="seed"
        data-number="${i}"
      >
    `;

    seedList.appendChild(item);
  }


  const normalCount =
    players - seeds;

  const normalList =
    document.getElementById("normal-list");

  normalList.innerHTML = "";


  for (let i = 1; i <= normalCount; i++) {

    const item =
      document.createElement("div");

    item.className =
      "participant-item";

    item.innerHTML = `
      <span class="participant-number">
        ${i}.
      </span>

      <input
        type="text"
        placeholder="参加者${i}の名前"
        data-type="normal"
        data-number="${i}"
      >
    `;

    normalList.appendChild(item);
  }


  document.getElementById(
    "participant-area"
  ).style.display = "block";


  document.getElementById(
    "tournament-area"
  ).style.display = "none";


  document.getElementById(
    "participant-area"
  ).scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   次に近い2の累乗を取得
========================= */

function getBracketSize(count) {

  let size = 1;

  while (size < count) {
    size *= 2;
  }

  return size;
}


/* =========================
   シード配置順
========================= */

function getSeedPositions(size) {

  let positions = [1, 2];

  while (positions.length < size) {

    const nextSize =
      positions.length * 2;

    const next = [];

    for (const pos of positions) {

      next.push(pos);
      next.push(nextSize + 1 - pos);

    }

    positions = next;
  }

  return positions;
}


/* =========================
   配列シャッフル
========================= */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [
      result[i],
      result[j]
    ] = [
      result[j],
      result[i]
    ];
  }

  return result;
}


/* =========================
   大会表作成
========================= */

function createTournament() {

  const game =
    document.getElementById("game").value;

  const players =
    Number(
      document.getElementById("players").value
    );

  const seeds =
    Number(
      document.getElementById("seeds").value
    );


  if (!game) {

    alert("大会種目を選択してください。");
    return;
  }


  if (game !== "hanafuda") {

    alert(
      "現在は花札大会表のみ作成できます。"
    );

    return;
  }


  if (players < 2) {

    alert(
      "参加人数を2人以上で入力してください。"
    );

    return;
  }


  /* シード取得 */

  const seedInputs =
    document.querySelectorAll(
      'input[data-type="seed"]'
    );

  const normalInputs =
    document.querySelectorAll(
      'input[data-type="normal"]'
    );


  const seedPlayers = [];

  seedInputs.forEach(input => {

    const name =
      input.value.trim();

    if (name) {
      seedPlayers.push(name);
    }

  });


  const normalPlayers = [];

  normalInputs.forEach(input => {

    const name =
      input.value.trim();

    if (name) {
      normalPlayers.push(name);
    }

  });


  const allPlayers =
    [
      ...seedPlayers,
      ...normalPlayers
    ];


  if (allPlayers.length !== players) {

    alert(
      `参加者名をすべて入力してください。\n` +
      `現在 ${allPlayers.length}人 / ${players}人`
    );

    return;
  }


  /* 重複チェック */

  const unique =
    new Set(allPlayers);

  if (unique.size !== allPlayers.length) {

    alert(
      "同じ名前の参加者が複数います。"
    );

    return;
  }


  /* トーナメント枠 */

  const bracketSize =
    getBracketSize(players);

  const rounds =
    Math.log2(bracketSize);


  /*
    1回戦の枠を作る

    シードは決められた位置へ配置。
    一般参加者は残りの枠へランダム配置。
  */

  const slots =
    new Array(bracketSize).fill(null);


  const seedPositions =
    getSeedPositions(bracketSize);


  seedPlayers.forEach(
    (player, index) => {

      const position =
        seedPositions[index];

      slots[position - 1] =
        player;
    }
  );


  /* 一般参加者をシャッフル */

  const shuffledNormals =
    shuffle(normalPlayers);


  let normalIndex = 0;

  for (
    let i = 0;
    i < slots.length;
    i++
  ) {

    if (
      slots[i] === null &&
      normalIndex < shuffledNormals.length
    ) {

      slots[i] =
        shuffledNormals[normalIndex];

      normalIndex++;
    }
  }


  /* データ保存 */

  tournamentData = {

    game: "hanafuda",

    playerCount: players,

    bracketSize: bracketSize,

    rounds: rounds,

    slots: slots,

    matches: [],

    hosts: {}

  };


  createMatches();

  renderTournament();


  document.getElementById(
    "tournament-area"
  ).style.display = "block";


  document.getElementById(
    "tournament-area"
  ).scrollIntoView({
    behavior: "smooth"
  });
}


/* =========================
   試合データ作成
========================= */

function createMatches() {

  tournamentData.matches = [];


  let currentSlots =
    tournamentData.slots;


  for (
    let round = 0;
    round < tournamentData.rounds;
    round++
  ) {

    const matchCount =
      currentSlots.length / 2;

    const roundMatches = [];


    for (
      let i = 0;
      i < matchCount;
      i++
    ) {

      const player1 =
        currentSlots[i * 2];

      const player2 =
        currentSlots[i * 2 + 1];


      roundMatches.push({

        player1:
          player1,

        player2:
          player2,

        winner:
          null,

        host:
          null

      });

    }


    tournamentData.matches.push(
      roundMatches
    );


    currentSlots =
      new Array(matchCount).fill(null);
  }
}


/* =========================
   大会表表示
========================= */

function renderTournament() {

  const bracket =
    document.getElementById("bracket");

  bracket.innerHTML = "";


  const info =
    document.getElementById("bracket-info");


  info.innerHTML =
    `参加人数：${tournamentData.playerCount}人　` +
    `｜ トーナメント枠：${tournamentData.bracketSize}人枠　` +
    `｜ 不戦勝：${
      tournamentData.bracketSize -
      tournamentData.playerCount
    }枠`;


  tournamentData.matches.forEach(
    (roundMatches, roundIndex) => {

      const round =
        document.createElement("div");

      round.className =
        "bracket-round";


      const title =
        document.createElement("div");

      title.className =
        "bracket-round-title";


      title.textContent =
        getRoundName(
          roundIndex,
          tournamentData.rounds
        );


      round.appendChild(title);


      roundMatches.forEach(
        (match, matchIndex) => {

          const matchElement =
            createMatchElement(
              match,
              roundIndex,
              matchIndex
            );

          round.appendChild(
            matchElement
          );

        }
      );


      bracket.appendChild(round);

    }
  );
}


/* =========================
   ラウンド名
========================= */

function getRoundName(
  roundIndex,
  totalRounds
) {

  const remaining =
    totalRounds - roundIndex;


  if (remaining === 1) {
    return "決勝";
  }

  if (remaining === 2) {
    return "準決勝";
  }

  if (remaining === 3) {
    return "準々決勝";
  }

  return `${remaining}回戦`;
}


/* =========================
   試合作成
========================= */

function createMatchElement(
  match,
  roundIndex,
  matchIndex
) {

  const box =
    document.createElement("div");

  box.className =
    "match";


  const number =
    document.createElement("div");

  number.className =
    "match-number";

  number.textContent =
    `${matchIndex + 1}試合目`;

  box.appendChild(number);


  const players = [
    match.player1,
    match.player2
  ];


  players.forEach(
    (player, playerIndex) => {

      const row =
        document.createElement("div");

      row.className =
        "player-row";


      const name =
        document.createElement("span");

      name.className =
        "player-name";


      if (!player) {

        name.innerHTML =
          `<span class="bye">不戦勝</span>`;

      } else {

        let prefix = "";

        if (
          match.host === player
        ) {

          prefix = "◎ ";

        }

        name.textContent =
          prefix + player;
      }


      row.appendChild(name);


      /*
        両方に名前がある場合、
        部屋主を指定できる
      */

      if (
        player &&
        players.filter(Boolean).length === 2
      ) {

        const hostButton =
          document.createElement("button");

        hostButton.className =
          "host-button";


        if (
          match.host === player
        ) {

          hostButton.classList.add(
            "active"
          );

        }


        hostButton.textContent =
          match.host === player
            ? "◎ 部屋主"
            : "部屋主にする";


        hostButton.onclick = () => {

          match.host = player;

          renderTournament();

        };


        row.appendChild(
          hostButton
        );
      }


      box.appendChild(row);

    }
  );


  /*
    不戦勝なら自動的に勝者を決定
  */

  if (
    (match.player1 && !match.player2) ||
    (!match.player1 && match.player2)
  ) {

    const winner =
      match.player1 ||
      match.player2;


    const byeText =
      document.createElement("div");

    byeText.style.marginTop =
      "8px";

    byeText.style.fontSize =
      "12px";

    byeText.style.color =
      "#756b5f";

    byeText.textContent =
      `→ ${winner} が不戦勝`;

    box.appendChild(
      byeText
    );
  }


  return box;
}

</script>

</body>
</html>
