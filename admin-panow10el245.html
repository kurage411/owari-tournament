<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- 未認証アクセスの弾き処理（一番上に配置） -->
  <script>
    if (sessionStorage.getItem("admin_authenticated") !== "true") {
      alert("ログインが必要です。");
      window.location.href = "admin.html";
    }
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>運営管理 | 尾張藩主催 花札・麻雀大会</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Yu Mincho",
        "Hiragino Mincho ProN",
        "Noto Serif JP",
        serif;

      color: #2b2926;

      background:
        linear-gradient(
          rgba(255, 250, 235, 0.82),
          rgba(255, 250, 235, 0.82)
        ),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 3px,
          rgba(80, 60, 40, 0.025) 4px
        );

      background-color: #f3ead5;
      min-height: 100vh;
    }

    /* 全体 */
    .container {
      width: min(900px, 92%);
      margin: 0 auto;
      padding: 50px 0 60px;
    }

    /* 上部 */
    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .header-kamon {
      font-size: 38px;
      color: #263d52;
      margin-bottom: 18px;
    }

    .header-subtitle {
      font-size: 14px;
      letter-spacing: 0.35em;
      color: #6d6255;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 40px);
      font-weight: normal;
      letter-spacing: 0.12em;
      color: #263d52;
    }

    .header-line {
      width: 120px;
      height: 2px;
      background: #a33a32;
      margin: 22px auto;
    }

    /* カテゴリセクション */
    .admin-section {
      margin-bottom: 40px;
    }

    .category-title {
      font-size: 20px;
      font-weight: normal;
      color: #263d52;
      letter-spacing: 0.15em;
      padding-bottom: 8px;
      border-bottom: 1px solid #817563;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .category-badge {
      display: inline-block;
      width: 32px;
      height: 32px;
      line-height: 32px;
      text-align: center;
      background: #263d52;
      color: #f3ead5;
      border-radius: 50%;
      font-size: 16px;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    /* 管理用ボタン */
    .admin-card {
      display: block;
      padding: 28px 20px;
      text-decoration: none;
      text-align: center;

      background: rgba(255, 252, 241, 0.72);
      border: 1px solid #a99b83;

      color: #2b2926;

      transition:
        transform 0.2s ease,
        background 0.2s ease,
        box-shadow 0.2s ease;
    }

    .admin-card:hover {
      transform: translateY(-3px);
      background: #fffaf0;
      box-shadow: 0 6px 16px rgba(70, 55, 40, 0.12);
    }

    .admin-card h3 {
      margin: 0 0 10px;
      font-size: 20px;
      font-weight: normal;
      letter-spacing: 0.12em;
      color: #263d52;
    }

    .card-arrow {
      color: #a33a32;
      font-size: 13px;
      letter-spacing: 0.15em;
    }

    /* ログアウト・戻るボタン */
    .logout-area {
      margin-top: 45px;
      text-align: center;
    }

    .logout-btn {
      display: inline-block;
      padding: 10px 25px;

      color: #5c5147;
      text-decoration: none;

      border: 1px solid #aaa08f;
      background: rgba(255, 252, 241, 0.5);

      font-size: 13px;
      letter-spacing: 0.12em;
      cursor: pointer;

      transition: background 0.2s ease;
    }

    .logout-btn:hover {
      background: #fffaf0;
    }

    /* 下部 */
    footer {
      margin-top: 60px;
      padding-top: 20px;
      border-top: 1px solid #b9ad99;

      text-align: center;
      color: #81766a;
      font-size: 12px;
      letter-spacing: 0.1em;
    }

    /* スマホ対応 */
    @media (max-width: 600px) {
      .container {
        padding-top: 35px;
      }

      .btn-grid {
        grid-template-columns: 1fr;
      }

      .admin-card {
        padding: 22px 15px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- ヘッダー -->
    <header class="header">

      <div class="header-kamon">紋</div>

      <div class="header-subtitle">
        尾張藩主催
      </div>

      <h1>
        大会運営 管理盤
      </h1>

      <div class="header-line"></div>

    </header>


    <!-- 花札 管理 -->
    <section class="admin-section">

      <h2 class="category-title">
        <span class="category-badge">花</span>
        花札大会 管理
      </h2>

      <div class="btn-grid">

        <a href="hfow10245-create.html" class="admin-card">
          <h3>トーナメント表作成</h3>
          <div class="card-arrow">作成画面へ →</div>
        </a>

        <a href="hfow10245-manage.html" class="admin-card">
          <h3>大会運営</h3>
          <div class="card-arrow">運営画面へ →</div>
        </a>

      </div>

    </section>


    <!-- 麻雀 管理 -->
    <section class="admin-section">

      <h2 class="category-title">
        <span class="category-badge">牌</span>
        麻雀大会 管理
      </h2>

      <div class="btn-grid">

        <a href="mjow10245-create.html" class="admin-card">
          <h3>トーナメント表作成</h3>
          <div class="card-arrow">作成画面へ →</div>
        </a>

        <a href="mjow10245-manage.html" class="admin-card">
          <h3>大会運営</h3>
          <div class="card-arrow">運営画面へ →</div>
        </a>

      </div>

    </section>


    <!-- ログアウト / トップへ戻る -->
    <section class="logout-area">

      <button onclick="logout()" class="logout-btn">
        表紙に戻る（ログアウト）
      </button>

    </section>


    <!-- フッター -->
    <footer>
      尾張藩主催 花札・麻雀大会 運営管理
    </footer>

  </main>

  <script>
    function logout() {
      // 認証情報を破棄してトップへ
      sessionStorage.removeItem("admin_authenticated");
      window.location.href = "index.html";
    }
  </script>

</body>
</html>
